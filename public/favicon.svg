<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#101412"/>
  <!-- Outer triad ring -->
  <circle cx="16" cy="16" r="10" stroke="#C8923A" stroke-width="1.6" opacity="0.35"/>
  <!-- Main circle -->
  <circle cx="16" cy="16" r="7.2" stroke="#C8923A" stroke-width="2"/>
  <!-- Center unit -->
  <circle cx="16" cy="16" r="2.6" fill="#F3EFE6"/>
  <!-- Three poles (Individualidad / Dualidad / Totalidad) -->
  <circle cx="16" cy="6.8" r="1.35" fill="#C8923A"/>
  <circle cx="23.2" cy="21.1" r="1.35" fill="#C8923A"/>
  <circle cx="8.8" cy="21.1" r="1.35" fill="#C8923A"/>
</svg>
